org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.workers.max=2
android.useAndroidX=true

# Workaround for Kotlin incremental compilation cache issues on Windows/Gradle.
# See: "Could not close incremental caches" in `shared_preferences_android`.
kotlin.incremental=false
